name: metric-history-check
on:
  push:
    branches: [ci-23702]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e . pytest pytest-timeout && pip install -r requirements/test-requirements.txt || true
      - run: pytest tests/server/test_handlers.py -k "metric_history" -p no:cacheprovider -q
